{% extends "base.html" %}
{% block title %}Karta klubova · Hrvatski nogometni klubovi{% endblock %}

{% block content %}
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
      integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="">
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
        integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
<link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.css">
<link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.Default.css">
<script src="https://unpkg.com/leaflet.markercluster@1.5.3/dist/leaflet.markercluster.js"></script>

<div class="flex items-center justify-between gap-3 flex-wrap mb-3">
  <div>
    <h1 class="text-xl font-bold">Karta klubova</h1>
    <p class="text-sm text-slate-500">
      <span class="font-medium">{{ geo_count }}</span> klubova lociranih
      od <span class="font-medium">{{ total }}</span>
      ({{ "%.0f"|format(100 * geo_count / total) }}%)
    </p>
  </div>
  <div class="text-xs text-slate-500">
    <span class="inline-flex items-center gap-1 mr-2"><span class="w-3 h-3 rounded-full bg-hr-red border border-white shadow"></span> T1</span>
    <span class="inline-flex items-center gap-1 mr-2"><span class="w-3 h-3 rounded-full bg-orange-500 border border-white shadow"></span> T2</span>
    <span class="inline-flex items-center gap-1 mr-2"><span class="w-3 h-3 rounded-full bg-amber-400 border border-white shadow"></span> T3</span>
    <span class="inline-flex items-center gap-1 mr-2"><span class="w-3 h-3 rounded-full bg-yellow-300 border border-white shadow"></span> T4</span>
    <span class="inline-flex items-center gap-1 mr-2"><span class="w-3 h-3 rounded-full bg-lime-300 border border-white shadow"></span> T5</span>
    <span class="inline-flex items-center gap-1 mr-2"><span class="w-3 h-3 rounded-full bg-emerald-300 border border-white shadow"></span> T6</span>
    <span class="inline-flex items-center gap-1 mr-2"><span class="w-3 h-3 rounded-full bg-sky-300 border border-white shadow"></span> T7</span>
    <span class="inline-flex items-center gap-1"><span class="w-3 h-3 rounded-full bg-slate-400 border border-white shadow"></span> T8</span>
  </div>
</div>

<div id="map" class="rounded-lg border border-slate-200" style="height: 78vh;"></div>

<script>
const TIER_COLORS = {
  1: '#c8102e', 2: '#f97316', 3: '#fbbf24', 4: '#fde047',
  5: '#bef264', 6: '#6ee7b7', 7: '#7dd3fc', 8: '#94a3b8',
};

const clubs = {{ clubs_json|safe }};

const map = L.map('map', { preferCanvas: true }).setView([45.1, 16.5], 7);
L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
  attribution: '© OpenStreetMap',
  maxZoom: 19,
}).addTo(map);

const cluster = L.markerClusterGroup({ chunkedLoading: true });

for (const c of clubs) {
  const color = TIER_COLORS[c.tier] || '#94a3b8';
  const m = L.circleMarker([c.lat, c.lng], {
    radius: c.tier && c.tier <= 2 ? 8 : 6,
    color: '#fff',
    weight: 1.5,
    fillColor: color,
    fillOpacity: 0.95,
  });
  const popup = `
    <div style="min-width:180px">
      <div style="font-weight:600;font-size:14px;margin-bottom:4px">
        <a href="/clubs/${c.slug}" style="color:#c8102e">${c.canonical_name}</a>
      </div>
      <div style="font-size:11px;color:#64748b;margin-bottom:6px">
        ${c.city ? c.city : ''}${c.city && c.county ? ' · ' : ''}${c.county ? c.county.replace(' županija','') : ''}
        ${c.tier ? ' · T' + c.tier : ''}
      </div>
      ${c.phone ? `<div style="font-size:11px">📞 ${c.phone}</div>` : ''}
      ${c.email ? `<div style="font-size:11px">✉ ${c.email}</div>` : ''}
    </div>`;
  m.bindPopup(popup);
  cluster.addLayer(m);
}
map.addLayer(cluster);

// Fit map to all markers if any
if (clubs.length > 0) {
  const bounds = L.latLngBounds(clubs.map(c => [c.lat, c.lng]));
  map.fitBounds(bounds, { padding: [20, 20] });
}
</script>
{% endblock %}
